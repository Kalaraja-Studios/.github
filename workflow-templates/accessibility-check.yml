name: Accessibility Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run accessibility tests
        run: npm run test:a11y --if-present
